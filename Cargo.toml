[workspace]
members = ["data", "server"]
resolver = "3"

[workspace.package]
authors = ["Raif S. Naffah <raif@mailbox.org>"]
edition = "2024"
repository = "https://github.com/raif-s-naffah/xapi-rs"
license = "GPL-3.0-or-later"

[workspace.dependencies]
async-recursion = "1.1.1"
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
dashmap = "6.2.1"
dotenvy = "0.15.7"
email_address = "0.2.9"
etag = "4.0.0"
fxhash = "0.2.1"
hex = "0.4.3"
iri-string = { version = "0.7.12", features = ["serde"] }
josekit = "0.10.3"
language-tags = "0.3.2"
lru = "0.18.0"
mime = "0.3.17"
openssl = "0.10.80"
rand = { version = "0.10.1", features = ["thread_rng"] }
rocket = { version = "0.5.1", features = ["json", "secrets", "tls"] }
rocket-multipart = { version = "0.2.1", features = ["json"] }
semver = "1.0.28"
serde = "1.0.228"
serde_json = "1.0.150"
serde_with = { version = "3.20.0", features = ["macros"] }
speedate = "0.17.0"
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "chrono",
    "uuid",
] }
take_mut = "0.2.2"

test-context = "0.5.8"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "chrono",
    "env-filter",
    "json",
    "parking_lot",
] }
tracing-test = "0.2.6"
unicase = "2.9.0"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.2", features = ["serde", "v7"] }
